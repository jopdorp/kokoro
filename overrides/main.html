{% extends "base.html" %}
{% block extrahead %}
  {{ super() }}
  {% if page and page.meta.social_title %}
    <meta property="og:title" content="{{ page.meta.social_title }}">
    <meta property="og:description" content="{{ page.meta.social_description }}">
    <meta property="og:image" content="https://jopdorp.github.io/oboromi/media/demo-dungeon-poster.png">
    <meta property="og:video" content="https://jopdorp.github.io/oboromi/media/demo-dungeon.mp4">
    <meta property="og:video:type" content="video/mp4">
    <meta property="og:video:width" content="1920">
    <meta property="og:video:height" content="1080">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://jopdorp.github.io/oboromi/media/demo-dungeon-poster.png">
  {% endif %}
{% endblock %}
